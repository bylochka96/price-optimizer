name: Validate and package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript and JSON
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); JSON.parse(require('fs').readFileSync('banners.json','utf8')); JSON.parse(require('fs').readFileSync('docs/banners.json','utf8'));"
          node tests/background-navigation.test.js
          node tests/localization-settings.test.js
      - name: Build Chrome Web Store ZIP
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-package
          path: dist/*.zip
