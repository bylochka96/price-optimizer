<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price Optimizer</title>
  <meta name="description" content="Price Optimizer converts TRY prices on MediaMarkt Türkiye into your selected currency.">
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #151515; background: #f2f2f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 28px; background: linear-gradient(145deg, #df0000 0 42%, #f2f2f2 42%); }
    article { width: min(760px, 100%); padding: 36px; border: 1px solid #ddd; border-radius: 18px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.16); }
    img { width: 76px; height: 76px; }
    h1 { margin: 18px 0 8px; font-size: clamp(32px, 7vw, 54px); }
    p { color: #555; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    a { padding: 10px 14px; border-radius: 8px; color: #fff; background: #df0000; font-weight: 700; text-decoration: none; }
    a.secondary { color: #222; background: #eee; }
  </style>
</head>
<body>
  <main><article>
    <img src="icon128.png" alt="Price Optimizer PO spiral icon">
    <h1>Price Optimizer</h1>
    <p>Convert Turkish lira prices on MediaMarkt Türkiye into a selected international currency while preserving the site's visual layout.</p>
    <nav>
      <a href="https://github.com/bylochka96/price-optimizer">Source code</a>
      <a class="secondary" href="privacy.html">Privacy policy</a>
      <a class="secondary" href="banners.json">Banner configuration</a>
    </nav>
  </article></main>
</body>
</html>
